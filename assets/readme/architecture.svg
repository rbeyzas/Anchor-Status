<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">How the oracle pipeline works</title>
  <desc id="arch-desc">Four collector services normalize into an aggregator, which submits reports and publishes score cards to the PerformanceOracle Soroban contract; it tracks trend and risk and cross-calls AnchorRegistry to update scores; the dashboard reads both contracts read-only over Soroban RPC, and anchors apply to be measured through the onboarding intake.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A404F"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <rect width="1200" height="600" rx="26" fill="#06080D"/>
  <rect x="0.5" y="0.5" width="1199" height="599" rx="25.5" fill="none" stroke="#282E3D"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" letter-spacing="2" fill="#6B7280">PIPELINE</text>
    <text x="64" y="82" font-size="24" font-weight="700" fill="#ECEEF5">Four collectors, one score, on-chain</text>

    <!-- Row 1: collectors -->
    <g transform="translate(64,112)">
      <rect width="254" height="104" rx="12" fill="#161A24" stroke="#2EE6A6"/>
      <circle cx="22" cy="28" r="5" fill="#2EE6A6"/>
      <text x="38" y="33" font-size="16" font-weight="700" fill="#ECEEF5">mainnet-probe</text>
      <text x="22" y="58" font-size="12.5" fill="#9EA6B8">Every live mainnet anchor, every</text>
      <text x="22" y="76" font-size="12.5" fill="#9EA6B8">20 min: SEP-1/6/10/24, read-only.</text>
      <text x="22" y="94" font-size="12.5" fill="#9EA6B8">No funds move.</text>
    </g>
    <g transform="translate(336,112)">
      <rect width="254" height="104" rx="12" fill="#161A24" stroke="#282E3D"/>
      <circle cx="22" cy="28" r="5" fill="#38BDF8"/>
      <text x="38" y="33" font-size="16" font-weight="700" fill="#ECEEF5">testnet-probe</text>
      <text x="22" y="58" font-size="12.5" fill="#9EA6B8">A real deposit and withdrawal,</text>
      <text x="22" y="76" font-size="12.5" fill="#9EA6B8">every payment checked on the</text>
      <text x="22" y="94" font-size="12.5" fill="#9EA6B8">ledger, not taken on trust.</text>
    </g>
    <g transform="translate(608,112)">
      <rect width="254" height="104" rx="12" fill="#161A24" stroke="#282E3D"/>
      <circle cx="22" cy="28" r="5" fill="#FBBF24"/>
      <text x="38" y="33" font-size="16" font-weight="700" fill="#ECEEF5">passive-monitor</text>
      <text x="22" y="58" font-size="12.5" fill="#9EA6B8">Horizon scan of issued assets:</text>
      <text x="22" y="76" font-size="12.5" fill="#9EA6B8">mint and burn flows, plus DEX</text>
      <text x="22" y="94" font-size="12.5" fill="#9EA6B8">peg samples against USDC.</text>
    </g>
    <g transform="translate(880,112)">
      <rect width="254" height="104" rx="12" fill="#161A24" stroke="#282E3D"/>
      <circle cx="22" cy="28" r="5" fill="#94A3B8"/>
      <text x="38" y="33" font-size="16" font-weight="700" fill="#ECEEF5">mock-anchors</text>
      <text x="22" y="58" font-size="12.5" fill="#9EA6B8">A known-good and a known-bad</text>
      <text x="22" y="76" font-size="12.5" fill="#9EA6B8">reference, so the scoring itself</text>
      <text x="22" y="94" font-size="12.5" fill="#9EA6B8">can be checked against truth.</text>
    </g>

    <path d="M191,216 L520,268" fill="none" stroke="#3A404F" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M463,216 L570,268" fill="none" stroke="#3A404F" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M735,216 L630,268" fill="none" stroke="#3A404F" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M1007,216 L680,268" fill="none" stroke="#3A404F" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="600" y="248" font-size="12" fill="#6B7280" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">reports + evidence</text>

    <!-- Row 2: aggregator -->
    <g transform="translate(430,274)">
      <rect width="340" height="66" rx="12" fill="#0F1420" stroke="#38BDF8"/>
      <text x="170" y="30" font-size="16" font-weight="700" fill="#ECEEF5" text-anchor="middle">aggregator</text>
      <text x="170" y="50" font-size="12.5" fill="#9EA6B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">dedupes, scores 30 days, publishes</text>
    </g>

    <path d="M600,340 L600,388" fill="none" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
    <text x="616" y="358" font-size="12.5" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">submit_report()</text>
    <text x="616" y="376" font-size="12.5" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">publish_score_card()</text>

    <!-- Row 3: contracts -->
    <g transform="translate(300,396)">
      <rect width="280" height="96" rx="12" fill="#161A24" stroke="#282E3D"/>
      <text x="20" y="30" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SOROBAN CONTRACT</text>
      <text x="20" y="54" font-size="17" font-weight="700" fill="#ECEEF5">PerformanceOracle</text>
      <text x="20" y="76" font-size="12.5" fill="#9EA6B8">Score cards with their inputs hash,</text>
      <text x="20" y="92" font-size="12.5" fill="#9EA6B8">EMA per source, trend and risk</text>
    </g>
    <g transform="translate(620,396)">
      <rect width="280" height="96" rx="12" fill="#161A24" stroke="#282E3D"/>
      <text x="20" y="30" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SOROBAN CONTRACT</text>
      <text x="20" y="54" font-size="17" font-weight="700" fill="#ECEEF5">AnchorRegistry</text>
      <text x="20" y="76" font-size="12.5" fill="#9EA6B8">Anchor identity, operator, optional</text>
      <text x="20" y="92" font-size="12.5" fill="#9EA6B8">stake and the score of record</text>
    </g>
    <path d="M580,434 L620,434" fill="none" stroke="#FB7185" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M620,458 L580,458" fill="none" stroke="#3A404F" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="600" y="512" font-size="12" fill="#FB7185" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">update_score()</text>

    <path d="M760,492 L760,524" fill="none" stroke="#3A404F" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Row 4: dashboard, and the way an anchor asks to be measured -->
    <g transform="translate(560,530)">
      <rect width="400" height="46" rx="10" fill="#0F1420" stroke="#282E3D"/>
      <circle cx="26" cy="23" r="5" fill="#FBBF24"/>
      <text x="42" y="28" font-size="15" font-weight="700" fill="#ECEEF5">dashboard</text>
      <text x="140" y="28" font-size="12.5" fill="#9EA6B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">reads both contracts read-only</text>
    </g>
    <g transform="translate(64,530)">
      <rect width="400" height="46" rx="10" fill="#0F1420" stroke="#282E3D"/>
      <circle cx="26" cy="23" r="5" fill="#2EE6A6"/>
      <text x="42" y="28" font-size="15" font-weight="700" fill="#ECEEF5">/apply</text>
      <text x="118" y="28" font-size="12.5" fill="#9EA6B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">an anchor asks to be measured</text>
    </g>
    <path d="M264,530 L191,222" fill="none" stroke="#3A404F" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <text x="214" y="380" font-size="12" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">checked each round</text>
  </g>
</svg>
