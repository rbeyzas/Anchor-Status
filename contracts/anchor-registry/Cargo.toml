[package]
name = "anchor-registry"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = ["contract"]
# The actual #[contract]/#[contractimpl] block, which exports wasm
# functions (e.g. `init`) via #[no_mangle]. These exports are linked into
# ANY wasm binary that depends on this crate, even as a library — so a
# dependent contract (performance-oracle) must disable this feature to
# avoid its own exports (which include a same-named `init`) colliding with
# ours in the final wasm module. See AnchorRegistryClient in src/client.rs
# for the export-free way to get a cross-contract call client instead.
contract = []

[dependencies]
soroban-sdk = "27.0.6"

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
