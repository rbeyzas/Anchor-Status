# Server B (secondary reporter): serves its own evidence, so verify-score
# can rebuild the cards it submits to a quorum, and its shadow cards.
# Read-only: no other path under /var/lib/anchor-status is exposed.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Content-addressed evidence documents: <sha256>.json, never modified.
    location /evidence/ {
        alias /var/lib/anchor-status/evidence/;
        default_type application/json;
        autoindex off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The cards this host computes every round (shadow mode).
    location = /shadow-cards.jsonl {
        alias /var/lib/anchor-status/shadow-cards.jsonl;
        default_type application/x-ndjson;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
    }

    location / { return 404; }
}
