# systemd drop-in for nginx: /etc/systemd/system/nginx.service.d/restart.conf
# Retry a failed start instead of staying down. On 21 Oct 2026 A rebooted,
# `nginx -t` timed out once in ExecStartPre, and nginx stayed down 2.5 days
# (evidence, status and applications files unreachable) until restarted.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=30s
