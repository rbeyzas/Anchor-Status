# The reference anchor at ref1.monarank.xyz (testnet). Always on: a stopped
# machine would fail the probe rounds that measure it.
app = "monarank-ref1"
primary_region = "fra"

[build]

[env]
  HOME_DOMAIN = "ref1.monarank.xyz"
  ASSET_CODE = "MONAREF"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/.well-known/stellar.toml"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
